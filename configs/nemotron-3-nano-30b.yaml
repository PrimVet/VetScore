input: data/segments.jsonl
output: results/nemotron-3-nano-30b.json

backend: openrouter
model: nvidia/nemotron-3-nano-30b-a3b

provider:
  only: ["crusoe"]

skip_segmentation: true
skip_decomposition: true

num_samples: 5
temperature: 1.0
reasoning_level: minimal
max_retries: 3

checkpoint_every: 10
